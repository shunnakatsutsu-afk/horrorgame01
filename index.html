<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>都市伝説捜査ファイル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">

    <!-- タイトル画面 -->
    <div id="title-screen">
      <div id="title-bg"></div>
      <div id="title-content">
        <div id="title-sub">都市伝説捜査ファイル</div>
        <div id="title-main">捜 査 選 択</div>
        <div id="scenario-list">

          <div class="scenario-card">
            <div class="sc-header">
              <div class="sc-number">No.01</div>
              <div class="sc-title">鏡　の　怪</div>
              <div class="sc-sub">消えた少女</div>
            </div>
            <div class="sc-desc">荻窪のアパートから少女が消えた。<br>残されたのは内側から割れた鏡だけ。</div>
            <div class="sc-btns">
              <button class="sc-btn sc-btn-new" onclick="startNew('kagami')">最 初 か ら</button>
              <button class="sc-btn sc-btn-cont hidden" id="sc-cont-kagami" onclick="startContinue('kagami')">続 き か ら</button>
            </div>
          </div>

          <div class="scenario-card">
            <div class="sc-header">
              <div class="sc-number">No.02</div>
              <div class="sc-title">深夜の着信</div>
              <div class="sc-sub">死者からの電話</div>
            </div>
            <div class="sc-desc">午前三時、死んだはずの親友から電話が来る。<br>声は確かに彼女のものだった。</div>
            <div class="sc-btns">
              <button class="sc-btn sc-btn-new" onclick="startNew('denwa')">最 初 か ら</button>
              <button class="sc-btn sc-btn-cont hidden" id="sc-cont-denwa" onclick="startContinue('denwa')">続 き か ら</button>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- メインゲーム画面 -->
    <div id="main-screen" class="hidden">
      <!-- 背景レイヤー -->
      <div id="bg-layer"></div>

      <!-- キャラクター立ち絵エリア -->
      <div id="chara-area">
        <div id="chara-left"  class="chara-slot hidden-chara"></div>
        <div id="chara-right" class="chara-slot hidden-chara"></div>
      </div>

      <!-- テキストボックス -->
      <div id="textbox">
        <div id="speaker-name"></div>
        <div id="main-text"></div>
        <div id="click-indicator">▼</div>
      </div>

      <!-- 選択肢 -->
      <div id="choices" class="hidden"></div>

      <!-- バックログボタン / タイトルボタン -->
      <button id="backlog-btn" onclick="openBacklog()">ログ&nbsp;[B]</button>
      <button id="title-btn" onclick="returnToTitle()">タイトル</button>

      <!-- バックログパネル -->
      <div id="backlog-panel" class="hidden">
        <div id="backlog-header">
          <span>バックログ</span>
          <span id="backlog-hint">B / Esc で閉じる</span>
          <button id="backlog-close" onclick="closeBacklog()">✕ 閉じる</button>
        </div>
        <div id="backlog-content"></div>
      </div>
    </div>

    <!-- エンディング画面 -->
    <div id="ending-screen" class="hidden">
      <div id="ending-bg"></div>
      <div id="ending-content">
        <div id="ending-label"></div>
        <div id="ending-title"></div>
        <div id="ending-text"></div>
        <button id="retry-btn" onclick="retryGame()">最初から</button>
      </div>
    </div>

  </div>

  <script src="characters.js"></script>
  <script src="backgrounds.js"></script>
  <script src="audio.js"></script>
  <script src="story_kagami.js"></script>
  <script src="story_denwa.js"></script>
  <script src="game.js"></script>
  <script>
    Game.init([STORY_KAGAMI, STORY_DENWA]);

    (function() {
      function initAudio() {
        Audio.init();
        document.removeEventListener('touchstart', initAudio);
        document.removeEventListener('click', initAudio);
        document.removeEventListener('keydown', initAudio);
      }
      document.addEventListener('touchstart', initAudio, { passive: true });
      document.addEventListener('click', initAudio);
      document.addEventListener('keydown', initAudio);
    })();
  </script>
</body>
</html>
